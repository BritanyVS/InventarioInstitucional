version: "3"

services:
  server:
    image: gitea/gitea:latest
    container_name: gitea-local
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    volumes:
      - ./gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3005:3000"   # Interfaz Web
      - "2222:22"     # Puerto SSH